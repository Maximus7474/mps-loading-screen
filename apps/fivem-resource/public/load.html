<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>Loading Screen RP</title>
		<style>
			:root {
				--bg: #0b0d12;
				--panel: #151a24;
				--accent: #ff4d2e;
				--accent2: #5ee6eb;
				--text: #f2f4f8;
				--muted: #9aa3b2;
				--font-display: "Oswald", "Rajdhani", "Arial Narrow", sans-serif;
				--font-body: "Inter", "Segoe UI", system-ui, sans-serif;
				--font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
				--scale: 1;
				--outline: 2px dashed var(--accent);
				--track: 3px;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
			}

			body.ls {
				margin: 0;
				height: 100vh;
				overflow: hidden;
				background: var(--bg);
				color: var(--text);
				font-family: var(--font-body);
				-webkit-font-smoothing: antialiased;
			}

			/* ---- Background layer ---- */
			.ls-bg {
				position: fixed;
				inset: 0;
				z-index: -2;
				background-color: var(--bg);
				background-size: cover;
				background-repeat: no-repeat;
				background-position: center;
				transform-origin: center;
			}

			.ls-bg--anime {
				animation: ls-drift 28s ease-in-out infinite alternate;
			}

			.ls-bg--image {
				background-image: none;
			}
			.ls-bg--video {
				object-fit: cover;
				width: 100%;
				height: 100%;
			}

			@keyframes ls-drift {
				from {
					transform: scale(1);
				}
				to {
					transform: scale(1.08);
				}
			}

			.ls-scrim {
				position: fixed;
				inset: 0;
				z-index: -1;
				background: radial-gradient(
					120% 90% at 50% 30%,
					rgba(0, 0, 0, 0) 0%,
					rgba(5, 7, 13, 0.55) 78%
				);
				backdrop-filter: blur(0px);
				-webkit-backdrop-filter: blur(0px);
			}

			/* ---- Stage ---- */
			.ls-stage {
				position: relative;
				height: 100vh;
				display: grid;
				place-items: center;
				padding: 6vw;
			}

			.ls-stage--left > .ls-urn {
				justify-self: start;
				text-align: left;
				max-width: min(560px, 94vw);
			}

			.ls-urn {
				display: flex;
				flex-direction: column;
				gap: clamp(18px, 3.2vh, 40px);
				width: min(720px, 90vw);
				transform: scale(var(--scale));
				transform-origin: center;
			}

			/* ---- Blocks ---- */
			.blk {
				margin: 0;
			}

			.blk-eyebrow {
				margin: 0 0 10px;
				font-family: var(--font-mono);
				font-size: clamp(11px, 1.4vw, 14px);
				letter-spacing: 0.34em;
				text-transform: uppercase;
				color: var(--accent2);
				opacity: 0.9;
			}

			.blk-title {
				margin: 0;
				font-family: var(--font-display);
				font-size: clamp(38px, 8.4vw, 92px);
				line-height: 0.96;
				font-weight: 700;
				letter-spacing: 0.01em;
				text-transform: uppercase;
				text-shadow: 0 2px 24px rgba(0, 0, 0, 0.45);
			}

			.blk-subtitle {
				margin: clamp(8px, 1.6vh, 16px) 0 0;
				font-size: clamp(15px, 2vw, 19px);
				color: var(--muted);
				text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
				max-width: 44ch;
			}

			/* ---- Status ticker ---- */
			.blk-status {
				display: flex;
				align-items: baseline;
				gap: 0.5em;
				margin: 0;
				font-family: var(--font-mono);
				font-size: clamp(12px, 1.5vw, 14px);
				letter-spacing: 0.18em;
				text-transform: uppercase;
				color: var(--muted);
			}

			.status-caret {
				width: 8px;
				height: 8px;
				border-radius: 999px;
				background: var(--accent);
				align-self: center;
				animation: ls-blink 1.1s steps(2, start) infinite;
			}

			@keyframes ls-blink {
				to {
					opacity: 0;
				}
			}

			/* ---- Progress ---- */
			.prog-head {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				margin-bottom: 8px;
				font-family: var(--font-mono);
				font-size: clamp(11px, 1.3vw, 13px);
				letter-spacing: 0.22em;
				text-transform: uppercase;
				color: var(--muted);
			}

			.prog-track {
				position: relative;
				height: var(--track);
				background: var(--panel);
				border: 1px solid rgba(255, 255, 255, 0.08);
			}

			.prog-fill {
				position: absolute;
				inset: 0 auto 0 0;
				width: 0%;
				background: linear-gradient(90deg, var(--accent), var(--accent2));
				box-shadow: 0 0 14px rgba(255, 77, 46, 0.5);
				transition: width 0.18s linear;
			}

			/* ---- Handover ---- */
			.blk-greet,
			.blk-addr {
				margin: 0;
				font-family: var(--font-mono);
				font-size: clamp(13px, 1.6vw, 16px);
				letter-spacing: 0.06em;
				color: var(--muted);
			}

			.blk-greet .h-name {
				color: var(--text);
				font-weight: 600;
			}

			.h-addr {
				color: var(--accent2);
			}

			/* ---- Footer links ---- */
			.blk-footer {
				display: flex;
				gap: clamp(10px, 1.6vw, 20px);
				flex-wrap: wrap;
				margin-top: 4px;
			}

			.link {
				font-family: var(--font-mono);
				font-size: clamp(11px, 1.3vw, 13px);
				letter-spacing: 0.16em;
				text-transform: uppercase;
				text-decoration: none;
				color: var(--muted);
				padding: 9px 16px;
				border: 1px solid rgba(255, 255, 255, 0.14);
				transition:
					color 120ms ease,
					border-color 120ms ease,
					background 120ms ease;
			}

			.link:hover,
			.link:focus-visible {
				color: var(--bg);
				background: var(--accent);
				border-color: var(--accent);
			}

			.link.is-off {
				display: none;
			}

			:focus-visible {
				outline: var(--outline);
				outline-offset: 3px;
			}

			@media (prefers-reduced-motion: reduce) {
				.ls-bg--anime {
					animation: none;
				}
				.status-caret {
					animation: none;
					opacity: 1;
				}
				.prog-fill {
					transition: none;
				}
			}
		</style>
	</head>
	<body class="ls">
		<div
			class="ls-bg ls-bg--anime"
			style="background: linear-gradient(180deg, #101320, #05070d)"
		></div>
		<div class="ls-scrim"></div>
		<main class="ls-stage ls-stage--right">
			<div class="ls-urn">
				<section class="blk blk--hero">
					<h1 class="blk-title">Loading Screen RP</h1>
				</section>
				<section class="blk blk--status" data-status>
					<p class="blk-status">
						<span class="status-text"></span><span class="status-caret" aria-hidden="true"></span>
					</p>
				</section>
				<section class="blk blk--progress">
					<div class="prog-head">
						<span class="prog-label">LOADING</span>
						<span class="prog-pct">0%</span>
					</div>
					<div class="prog-track"><div class="prog-fill"></div></div>
				</section>
				<section class="blk blk--handover">
					<p class="blk-greet">
						<span class="h-prefix">Welcome, </span><span class="h-name"></span>
					</p>
					<p class="blk-addr">
						<span class="h-prefix">Connecting to </span><code class="h-addr"></code>
					</p>
				</section>
				<nav class="blk blk--footer">
					<a class="link" data-index="0" href="#"><span class="link-label">Discord</span></a>
					<a class="link" data-index="1" href="#"><span class="link-label">Website</span></a>
				</nav>
			</div>
		</main>
		<script>
			(() => {
				"use strict";

				const $ = (s) => document.querySelector(s);
				const setText = (el, v) => {
					if (el) el.textContent = v;
				};
				const clamp01 = (v) => {
					v = Number(v);
					if (!Number.isFinite(v)) return 0;
					return Math.min(1, Math.max(0, v));
				};
				const isObj = (v) => v !== null && typeof v === "object";

				// window.nuiHandoverData is injected by FiveM; missing during a plain
				// file:// preview, so reconcile reads it lazily after DOMContentLoaded.
				const DATA = {};
				function captureData() {
					Object.assign(DATA, window.nuiHandoverData || {});
				}

				function setProgress(fraction) {
					const fill = $(".prog-fill");
					const pct = $(".prog-pct");
					if (fill) fill.style.width = fraction * 100 + "%";
					if (pct) pct.textContent = Math.round(fraction * 100) + "%";
				}

				function reconcile() {
					captureData();

					const title = $(".blk-title");
					if (title) setText(title, DATA.serverName || "Loading Screen RP");

					const name = $(".h-name");
					if (name) setText(name, DATA.name || "");
					const addr = $(".h-addr");
					if (addr) setText(addr, DATA.serverAddress || "");

					// Footer links resolve from handover first, statically baked as fallback.
					const bakedLinks = [
						{ label: "Discord", url: "https://discord.gg/example" },
						{ label: "Website", url: "https://example.com" },
					];
					document.querySelectorAll("[data-index]").forEach((a) => {
						const i = Number(a.getAttribute("data-index"));
						if (!Number.isInteger(i)) return;
						const list = Array.isArray(DATA.links) ? DATA.links : bakedLinks;
						const link = (Array.isArray(list) && list[i]) || bakedLinks[i] || null;
						const url = (link && link.url) || "";
						const labelEl = a.querySelector(".link-label") || a;
						setText(labelEl, (link && link.label) || "");
						a.setAttribute("href", url || "#");
						if (url) a.classList.remove("is-off");
						else a.classList.add("is-off");
					}); // Status ticker.
					const statusEl = $(".status-text");
					if (statusEl) {
						const fromGlobal = false;
						let lines = ["Booting day one", "Calibrating traffic density", "Chasing the sunset"];
						if (fromGlobal && Array.isArray(DATA.statuses) && DATA.statuses.length)
							lines = DATA.statuses;
						if (!Array.isArray(lines) || !lines.length) lines = [];
						if (lines.length) {
							let i = 0;
							setText(statusEl, lines[0]);
							if (lines.length > 1) {
								setInterval(() => {
									i = (i + 1) % lines.length;
									setText(statusEl, lines[i]);
								}, 2600);
							}
						}
					}
				}

				// Keep the whole stage visible no matter the viewport (the app's preview
				// pane is not 16:9, and players run 4:3 / ultrawide / tiny windows): measure
				// the content and scale it down only when it would overflow.
				function fitToViewport() {
					const stage = $(".ls-stage");
					const urn = $(".ls-urn");
					if (!stage || !urn) return;
					const cs = getComputedStyle(stage);
					const padV = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
					const avail = Math.max(1, stage.clientHeight - padV);
					const natural = urn.offsetHeight; // layout height, ignores the transform
					if (!natural) return;
					const theme = parseFloat(getComputedStyle(urn).getPropertyValue("--scale")) || 1;
					const scale = Math.min(theme, avail / natural);
					urn.style.transformOrigin = stage.classList.contains("ls-stage--left")
						? "top center"
						: "center";
					urn.style.transform = "scale(" + scale.toFixed(4) + ")";
				}

				window.addEventListener("message", (event) => {
					if (!isObj(event.data) || typeof event.data.eventName !== "string") return;
					if (event.data.eventName === "loadProgress") {
						setProgress(clamp01(event.data.loadFraction));
					}
				});

				function boot() {
					reconcile();
					fitToViewport();
				}

				captureData();
				if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
				else boot();
				window.addEventListener("resize", fitToViewport);
			})();
		</script>
	</body>
</html>
