name: Release Project

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Determine Target Version
        id: versioning
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VER="${{ inputs.version }}"
            VER="${INPUT_VER#v}"
          else
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          fi
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "TAG_NAME=v$VER" >> $GITHUB_ENV
          echo "target_version=$VER" >> $GITHUB_OUTPUT

      - name: Update Monorepo Package Versions
        run: bun run scripts/bumpversion.ts ${{ env.VERSION }}

      - name: Install Monorepo Dependencies
        run: bun install --frozen-lockfile

      - name: Build FiveM Resource
        run: bun run resource:build

      - name: Build Tauri Desktop Executable
        run: bun run desktop:build

      - name: Bundle FiveM Resource Artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist-artifacts"
          # Archive fivem-resource dist folder along with manifest & resource files
          Compress-Archive -Path "apps/fivem-resource/dist/*", "apps/fivem-resource/resource/*" -DestinationPath "dist-artifacts/fivem-resource.zip" -Force

      - name: Commit Updated Version Tags
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json apps/*/package.json packages/*/package.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/tauri.conf.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(release): bump package versions to ${{ env.TAG_NAME }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "Failed to push committed version changes, continuing release process."
          fi

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configurationJson: |
            {
              "template": "# What's Changed\n\n#{{CHANGELOG}}\n\n**Full Commit Log**: https://github.com/${{github.repository}}/commits/${{env.TAG_NAME}}",
              "categories": [
                { "title": "🚀 Features", "labels": ["feat", "feature"] },
                { "title": "🐛 Fixes", "labels": ["fix", "perf"] },
                { "title": "🧰 Maintenance", "labels": ["chore", "refactor"] }
              ],
              "ignore_manifest": true
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            dist-artifacts/fivem-resource.zip
            apps/desktop/src-tauri/target/release/mps-loading-screen-app.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
